<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1510" viewBox="0 0 720 1510" role="img" aria-labelledby="title desc">
  <title id="title">MyP-M-A 面向 Vibe Coding 的五阶段产品闭环移动版</title>
  <desc id="desc">五个同构阶段依次为 Review、Idea、PRD、开发承接和 Acceptance。绿色表示工作阶段，橙色表示决策门；Prompt 跨阶段工作，验收产生的新证据返回 Review，深绿色证据轨道贯穿全流程。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#70847C"/>
    </marker>
    <marker id="arrow-gate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#D47B18"/>
    </marker>
  </defs>

  <rect width="720" height="1510" fill="#F7F2E8"/>
  <rect x="1" y="1" width="718" height="1508" fill="none" stroke="#D8CEBC" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="54" fill="#17231F" font-size="33" font-weight="750">从输入到发布判断</text>
    <text x="40" y="88" fill="#68736E" font-size="20">五个阶段，共享一套清晰的交付结构。</text>

    <g transform="translate(40 108)">
      <circle cx="7" cy="8" r="6" fill="#2A8468"/>
      <text x="21" y="14" fill="#4F5E58" font-size="16" font-weight="650">工作阶段</text>
      <circle cx="132" cy="8" r="6" fill="#D98522"/>
      <text x="146" y="14" fill="#4F5E58" font-size="16" font-weight="650">决策门</text>
    </g>

    <g id="prompt-band" transform="translate(40 146)">
      <rect width="640" height="68" rx="6" fill="#EEE6D7" stroke="#CFC3AF"/>
      <text x="20" y="27" fill="#665B49" font-size="18" font-weight="700">/prompt · 跨阶段</text>
      <text x="20" y="51" fill="#68706B" font-size="17">压缩下一步交接，不改写已确认事实</text>
    </g>

    <g id="source-input" data-stage-card="source" transform="translate(128 240)">
      <rect class="stage-frame" width="540" height="90" rx="6" fill="#EEE6D7" stroke="#D2C5AF"/>
      <text x="20" y="28" fill="#806842" font-size="16" font-weight="700">输入</text>
      <text x="20" y="64" fill="#17231F" font-size="26" font-weight="750">项目与材料</text>
      <text x="196" y="62" fill="#59645F" font-size="17">路径 · 想法 · PRD · 截图 · 日志 · 产物</text>
    </g>

    <path d="M80 445 V1181" fill="none" stroke="#7E9189" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M668 1181 H692 V1336 H28 V445 H54" fill="none" stroke="#D47B18" stroke-width="3" marker-end="url(#arrow-gate)"/>

    <g text-anchor="middle" font-size="18" font-weight="750">
      <circle cx="80" cy="445" r="23" fill="#F7F2E8" stroke="#2A8468" stroke-width="3"/><text x="80" y="451" fill="#1F7159">01</text>
      <circle cx="80" cy="629" r="23" fill="#FFF3E4" stroke="#D98522" stroke-width="3"/><text x="80" y="635" fill="#B76612">02</text>
      <circle cx="80" cy="813" r="23" fill="#F7F2E8" stroke="#2A8468" stroke-width="3"/><text x="80" y="819" fill="#1F7159">03</text>
      <circle cx="80" cy="997" r="23" fill="#F7F2E8" stroke="#2A8468" stroke-width="3"/><text x="80" y="1003" fill="#1F7159">04</text>
      <circle cx="80" cy="1181" r="23" fill="#FFF3E4" stroke="#D98522" stroke-width="3"/><text x="80" y="1187" fill="#B76612">05</text>
    </g>

    <g id="stage-review" data-stage-card="work" transform="translate(128 368)">
      <rect class="stage-frame" width="540" height="154" rx="7" fill="#FBFCF9" stroke="#2A8468" stroke-width="2"/>
      <text x="20" y="30" fill="#1F7159" font-size="17" font-weight="700">/review</text>
      <rect x="446" y="12" width="74" height="28" rx="4" fill="#E6F1EC"/>
      <text x="483" y="32" text-anchor="middle" fill="#1F7159" font-size="14" font-weight="700">工作</text>
      <text x="20" y="72" fill="#17231F" font-size="29" font-weight="750">建立地图</text>
      <text x="20" y="108" fill="#59645F" font-size="18">问题在哪？</text>
      <text x="20" y="134" fill="#59645F" font-size="18">影响到哪？</text>
      <rect x="294" y="96" width="226" height="40" rx="5" fill="#E6F1EC"/>
      <text x="407" y="122" text-anchor="middle" fill="#1F7159" font-size="17" font-weight="700">交付：问题地图</text>
    </g>

    <g id="stage-idea" data-stage-card="gate" transform="translate(128 552)">
      <rect class="stage-frame" width="540" height="154" rx="7" fill="#FFF8ED" stroke="#D98522" stroke-width="2"/>
      <text x="20" y="30" fill="#B76612" font-size="17" font-weight="700">/idea</text>
      <rect x="440" y="12" width="80" height="28" rx="4" fill="#FFE8C8"/>
      <text x="480" y="32" text-anchor="middle" fill="#A85D0E" font-size="14" font-weight="700">决策门</text>
      <text x="20" y="72" fill="#17231F" font-size="29" font-weight="750">判断价值</text>
      <text x="20" y="108" fill="#59645F" font-size="18">是真问题吗？</text>
      <text x="20" y="134" fill="#59645F" font-size="18">现在做吗？</text>
      <rect x="294" y="96" width="226" height="40" rx="5" fill="#FFE8C8"/>
      <text x="407" y="122" text-anchor="middle" fill="#A85D0E" font-size="17" font-weight="700">交付：价值结论</text>
    </g>

    <g id="stage-prd" data-stage-card="work" transform="translate(128 736)">
      <rect class="stage-frame" width="540" height="154" rx="7" fill="#FBFCF9" stroke="#2A8468" stroke-width="2"/>
      <text x="20" y="30" fill="#1F7159" font-size="17" font-weight="700">/prd</text>
      <rect x="446" y="12" width="74" height="28" rx="4" fill="#E6F1EC"/>
      <text x="483" y="32" text-anchor="middle" fill="#1F7159" font-size="14" font-weight="700">工作</text>
      <text x="20" y="72" fill="#17231F" font-size="29" font-weight="750">定义需求</text>
      <text x="20" y="108" fill="#59645F" font-size="18">范围和状态？</text>
      <text x="20" y="134" fill="#59645F" font-size="18">原型与验收？</text>
      <rect x="294" y="96" width="226" height="40" rx="5" fill="#E6F1EC"/>
      <text x="407" y="122" text-anchor="middle" fill="#1F7159" font-size="17" font-weight="700">交付：PRD · 原型</text>
    </g>

    <g id="stage-handoff" data-stage-card="work" transform="translate(128 920)">
      <rect class="stage-frame" width="540" height="154" rx="7" fill="#FBFCF9" stroke="#2A8468" stroke-width="2"/>
      <text x="20" y="30" fill="#1F7159" font-size="17" font-weight="700">开发承接</text>
      <rect x="446" y="12" width="74" height="28" rx="4" fill="#E6F1EC"/>
      <text x="483" y="32" text-anchor="middle" fill="#1F7159" font-size="14" font-weight="700">工作</text>
      <text x="20" y="72" fill="#17231F" font-size="29" font-weight="750">承接开发</text>
      <text x="20" y="108" fill="#59645F" font-size="18">如何实施？</text>
      <text x="20" y="134" fill="#59645F" font-size="18">怎样回退？</text>
      <rect x="294" y="96" width="226" height="40" rx="5" fill="#E6F1EC"/>
      <text x="407" y="122" text-anchor="middle" fill="#1F7159" font-size="17" font-weight="700">交付：执行计划</text>
    </g>

    <g id="stage-acceptance" data-stage-card="gate" transform="translate(128 1104)">
      <rect class="stage-frame" width="540" height="154" rx="7" fill="#FFF8ED" stroke="#D98522" stroke-width="2"/>
      <text x="20" y="30" fill="#B76612" font-size="17" font-weight="700">/acceptance</text>
      <rect x="440" y="12" width="80" height="28" rx="4" fill="#FFE8C8"/>
      <text x="480" y="32" text-anchor="middle" fill="#A85D0E" font-size="14" font-weight="700">决策门</text>
      <text x="20" y="72" fill="#17231F" font-size="29" font-weight="750">验证结果</text>
      <text x="20" y="108" fill="#59645F" font-size="18">产物一致吗？</text>
      <text x="20" y="134" fill="#59645F" font-size="18">发布或回退？</text>
      <rect x="294" y="96" width="226" height="40" rx="5" fill="#FFE8C8"/>
      <text x="407" y="122" text-anchor="middle" fill="#A85D0E" font-size="17" font-weight="700">交付：发布判断</text>
    </g>

    <rect x="170" y="1308" width="380" height="40" fill="#F7F2E8"/>
    <text x="360" y="1335" text-anchor="middle" fill="#B76612" font-size="18" font-weight="700">验收反馈与新证据返回 /review</text>

    <g transform="translate(40 1380)">
      <rect width="640" height="92" rx="7" fill="#10221C"/>
      <text x="20" y="29" fill="#F0B35B" font-size="17" font-weight="700">证据轨道</text>
      <text x="122" y="29" fill="#F7F2E8" font-size="17" font-weight="650">仓库事实源 → 需求与版本 ID → 实施与测试</text>
      <text x="20" y="64" fill="#DCE9E3" font-size="17" font-weight="650">截图 · 日志 · 产物 · 发布结论</text>
    </g>
  </g>
</svg>
