    <text x="48" y="151" fill="#F6F2E8" font-size="64" font-weight="750">MyP-M-A</text>
    <text x="48" y="203" fill="#D4DED9" font-size="29">把产品判断与交付证据</text>
    <text x="48" y="243" fill="#D4DED9" font-size="29">串成一条工作流</text>

