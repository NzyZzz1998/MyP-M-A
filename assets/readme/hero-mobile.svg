<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">MyP-M-A 产品工作流移动版</title>
  <desc id="desc">MyP-M-A 将项目评审、价值判断、需求定义和真实验收串成一条证据驱动的中文产品工作流。</desc>

  <rect width="720" height="900" rx="24" fill="#0B1412"/>
  <rect x="1" y="1" width="718" height="898" rx="23" fill="none" stroke="#2A3B36" stroke-width="2"/>

  <g font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">
