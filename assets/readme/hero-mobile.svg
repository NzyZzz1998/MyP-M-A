      <text x="86" y="62" fill="#D4DED9" font-size="22">验证问题、价值与时机</text>
    </g>
    <g transform="translate(48 612)">
      <circle cx="34" cy="34" r="32" fill="#17382F" stroke="#39BC91" stroke-width="2"/>
      <text x="86" y="29" fill="#39BC91" font-size="25" font-weight="700">定义</text>
      <text x="86" y="62" fill="#D4DED9" font-size="22">锁定范围、状态与验收</text>
    </g>
    <g transform="translate(48 696)">
      <circle cx="34" cy="34" r="32" fill="#2F2A1D" stroke="#F0B35B" stroke-width="2"/>
      <text x="86" y="29" fill="#F0B35B" font-size="25" font-weight="700">验证</text>
