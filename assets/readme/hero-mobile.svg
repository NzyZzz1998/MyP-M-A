    <line x1="48" y1="370" x2="672" y2="370" stroke="#2A3B36" stroke-width="2"/>
    <text x="48" y="418" fill="#A8BBB3" font-size="17" font-weight="700" letter-spacing="2">产品闭环</text>

    <line x1="82" y1="462" x2="82" y2="748" stroke="#355048" stroke-width="4"/>

    <g transform="translate(48 444)">
      <circle cx="34" cy="34" r="32" fill="#17382F" stroke="#39BC91" stroke-width="2"/>
      <text x="86" y="29" fill="#39BC91" font-size="25" font-weight="700">理解</text>
      <text x="86" y="62" fill="#D4DED9" font-size="22">建立产品与工程地图</text>
    </g>
    <g transform="translate(48 528)">
