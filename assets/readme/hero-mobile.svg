    </g>
    <text x="294" y="308" fill="#A8BBB3" font-size="20">中文优先 · 自动路由 · 证据驱动</text>

    <path d="M82 374V744" stroke="#355048" stroke-width="4"/>

    <g transform="translate(48 350)">
      <rect x="68" width="556" height="92" rx="8" fill="#14221F" stroke="#355048"/>
      <circle cx="34" cy="46" r="34" fill="#17382F" stroke="#39BC91" stroke-width="2"/>
      <text x="24" y="56" fill="#F6F2E8" font-size="28" font-weight="700">1</text>
      <text x="96" y="38" fill="#39BC91" font-size="27" font-weight="700">/review</text>
      <text x="96" y="70" fill="#D4DED9" font-size="23">建立地图，定位问题</text>
    </g>

    <g transform="translate(48 466)">
      <rect x="68" width="556" height="92" rx="8" fill="#14221F" stroke="#355048"/>
      <circle cx="34" cy="46" r="34" fill="#2F2A1D" stroke="#F0B35B" stroke-width="2"/>
      <text x="24" y="56" fill="#F6F2E8" font-size="28" font-weight="700">2</text>
      <text x="96" y="38" fill="#F0B35B" font-size="27" font-weight="700">/idea</text>
      <text x="96" y="70" fill="#D4DED9" font-size="23">验证真伪、价值与时机</text>
    </g>

    <g transform="translate(48 582)">
      <rect x="68" width="556" height="92" rx="8" fill="#14221F" stroke="#355048"/>
      <circle cx="34" cy="46" r="34" fill="#17382F" stroke="#39BC91" stroke-width="2"/>
      <text x="24" y="56" fill="#F6F2E8" font-size="28" font-weight="700">3</text>
      <text x="96" y="38" fill="#39BC91" font-size="27" font-weight="700">/prd</text>
      <text x="96" y="70" fill="#D4DED9" font-size="23">收敛范围、原型与验收</text>
    </g>

    <g transform="translate(48 698)">
      <rect x="68" width="556" height="92" rx="8" fill="#14221F" stroke="#355048"/>
      <circle cx="34" cy="46" r="34" fill="#2F2A1D" stroke="#F0B35B" stroke-width="2"/>
