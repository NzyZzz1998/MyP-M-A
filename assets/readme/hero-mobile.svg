<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920" role="img" aria-labelledby="title desc">
  <title id="title">MyP-M-A 证据驱动的中文产品工作流移动版</title>
  <desc id="desc">MyP-M-A 从项目评审、价值判断、需求定义、开发承接到真实验收，保持事实、范围和证据连续。</desc>

  <rect width="720" height="920" rx="24" fill="#0B1412"/>
  <rect x="1" y="1" width="718" height="918" rx="23" fill="none" stroke="#2A3B36" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
