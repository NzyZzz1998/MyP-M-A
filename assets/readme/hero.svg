<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">MyP-M-A 产品工作流</title>
  <desc id="desc">MyP-M-A 将项目评审、价值判断、需求定义和真实验收串成一条证据驱动的中文产品工作流。</desc>

  <rect width="1200" height="460" rx="24" fill="#0B1412"/>
  <rect x="1" y="1" width="1198" height="458" rx="23" fill="none" stroke="#2A3B36" stroke-width="2"/>

  <g opacity="0.28" stroke="#2A3B36" stroke-width="1">
    <path d="M48 74H574"/>
    <path d="M48 388H574"/>
    <path d="M602 32V428"/>
  </g>

  <g font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">
    <text x="64" y="78" fill="#F0B35B" font-size="20" font-weight="700">MY PRODUCT MANAGER ASSISTANT</text>
    <text x="64" y="164" fill="#F6F2E8" font-size="66" font-weight="750">MyP-M-A</text>
    <text x="64" y="211" fill="#D4DED9" font-size="25">把产品判断与交付证据，串成一条工作流</text>

    <text x="64" y="278" fill="#A8BBB3" font-size="20">中文优先 · 自动路由 · 阶段化交付</text>
    <text x="64" y="313" fill="#A8BBB3" font-size="20">项目文档为事实源 · 外部工具按需接入</text>

    <g transform="translate(64 352)">
      <rect width="164" height="40" rx="6" fill="#17382F" stroke="#39BC91"/>
      <circle cx="22" cy="20" r="5" fill="#39BC91"/>
      <text x="38" y="27" fill="#EAF7F1" font-size="18" font-weight="700">v0.35.0 Stable</text>
    </g>
    <text x="250" y="379" fill="#A8BBB3" font-size="18">85 稳定用例 · 21 挑战用例 · 34 触发用例</text>

    <path d="M655 78V382" stroke="#355048" stroke-width="3"/>

    <g transform="translate(628 48)">
      <rect x="38" width="470" height="72" rx="8" fill="#14221F" stroke="#355048"/>
      <circle cx="28" cy="36" r="28" fill="#17382F" stroke="#39BC91" stroke-width="2"/>
      <text x="20" y="44" fill="#F6F2E8" font-size="23" font-weight="700">1</text>
      <text x="64" y="30" fill="#39BC91" font-size="20" font-weight="700">/review</text>
      <text x="64" y="55" fill="#D4DED9" font-size="18">建立地图，定位问题</text>
    </g>

    <g transform="translate(628 139)">
      <rect x="38" width="470" height="72" rx="8" fill="#14221F" stroke="#355048"/>
      <circle cx="28" cy="36" r="28" fill="#2F2A1D" stroke="#F0B35B" stroke-width="2"/>
      <text x="20" y="44" fill="#F6F2E8" font-size="23" font-weight="700">2</text>
      <text x="64" y="30" fill="#F0B35B" font-size="20" font-weight="700">/idea</text>
      <text x="64" y="55" fill="#D4DED9" font-size="18">验证真伪、价值与时机</text>
    </g>

    <g transform="translate(628 230)">
      <rect x="38" width="470" height="72" rx="8" fill="#14221F" stroke="#355048"/>
      <circle cx="28" cy="36" r="28" fill="#17382F" stroke="#39BC91" stroke-width="2"/>
      <text x="20" y="44" fill="#F6F2E8" font-size="23" font-weight="700">3</text>
      <text x="64" y="30" fill="#39BC91" font-size="20" font-weight="700">/prd</text>
      <text x="64" y="55" fill="#D4DED9" font-size="18">收敛范围、原型与验收</text>
    </g>

    <g transform="translate(628 321)">
      <rect x="38" width="470" height="72" rx="8" fill="#14221F" stroke="#355048"/>
      <circle cx="28" cy="36" r="28" fill="#2F2A1D" stroke="#F0B35B" stroke-width="2"/>
      <text x="20" y="44" fill="#F6F2E8" font-size="23" font-weight="700">4</text>
      <text x="64" y="30" fill="#F0B35B" font-size="20" font-weight="700">/acceptance</text>
