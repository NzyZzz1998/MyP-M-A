<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">MyP-M-A 证据驱动的中文产品工作流</title>
  <desc id="desc">MyP-M-A 从项目评审、价值判断、需求定义、开发承接到真实验收，保持事实、范围和证据连续。</desc>

  <rect width="1200" height="420" rx="24" fill="#0B1412"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#2A3B36" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="60" y="66" fill="#F0B35B" font-size="18" font-weight="700" letter-spacing="2">EVIDENCE-DRIVEN PRODUCT WORKFLOW</text>
    <text x="60" y="154" fill="#F6F2E8" font-size="68" font-weight="750">MyP-M-A</text>
    <text x="60" y="204" fill="#D4DED9" font-size="26">从项目地图到发布判断</text>
    <text x="60" y="240" fill="#D4DED9" font-size="26">让事实、范围与交付证据保持连续</text>

    <g transform="translate(60 292)">
      <rect width="176" height="42" rx="6" fill="#17382F" stroke="#39BC91"/>
      <circle cx="22" cy="21" r="5" fill="#39BC91"/>
      <text x="38" y="28" fill="#EAF7F1" font-size="18" font-weight="700">v0.40.0 Stable</text>
    </g>
    <text x="60" y="374" fill="#A8BBB3" font-size="18">106 稳定用例 · 39 挑战用例 · 34 触发用例</text>

    <line x1="636" y1="44" x2="636" y2="376" stroke="#2A3B36" stroke-width="2"/>

    <g transform="translate(688 50)">
      <text x="0" y="0" fill="#A8BBB3" font-size="16" font-weight="700" letter-spacing="2">THE PRODUCT LOOP</text>

      <line x1="18" y1="52" x2="18" y2="286" stroke="#355048" stroke-width="3"/>
      <path d="M18 286 V316 H388" fill="none" stroke="#F0B35B" stroke-width="3"/>

      <g transform="translate(0 34)">
        <circle cx="18" cy="18" r="18" fill="#17382F" stroke="#39BC91" stroke-width="2"/>
        <text x="50" y="15" fill="#39BC91" font-size="20" font-weight="700">理解</text>
        <text x="50" y="42" fill="#D4DED9" font-size="18">建立产品与工程地图</text>
      </g>
      <g transform="translate(0 108)">
        <circle cx="18" cy="18" r="18" fill="#2F2A1D" stroke="#F0B35B" stroke-width="2"/>
        <text x="50" y="15" fill="#F0B35B" font-size="20" font-weight="700">判断</text>
        <text x="50" y="42" fill="#D4DED9" font-size="18">验证问题、价值与时机</text>
      </g>
      <g transform="translate(0 182)">
        <circle cx="18" cy="18" r="18" fill="#17382F" stroke="#39BC91" stroke-width="2"/>
        <text x="50" y="15" fill="#39BC91" font-size="20" font-weight="700">定义</text>
        <text x="50" y="42" fill="#D4DED9" font-size="18">锁定范围、状态与验收</text>
      </g>
      <g transform="translate(0 256)">
        <circle cx="18" cy="18" r="18" fill="#2F2A1D" stroke="#F0B35B" stroke-width="2"/>
        <text x="50" y="15" fill="#F0B35B" font-size="20" font-weight="700">验证</text>
        <text x="50" y="42" fill="#D4DED9" font-size="18">用真实产物决定能否发布</text>
      </g>

      <text x="0" y="352" fill="#F6F2E8" font-size="18" font-weight="700">事实源</text>
      <text x="82" y="352" fill="#A8BBB3" font-size="18">→</text>
      <text x="116" y="352" fill="#F6F2E8" font-size="18" font-weight="700">阶段交付</text>
      <text x="220" y="352" fill="#A8BBB3" font-size="18">→</text>
      <text x="254" y="352" fill="#F6F2E8" font-size="18" font-weight="700">证据闭环</text>
    </g>
  </g>
</svg>
