      <rect x="0" y="338" width="480" height="42" rx="6" fill="#0F1B18" stroke="#2A3B36"/>
      <text x="240" y="365" text-anchor="middle" fill="#D4DED9" font-size="18" font-weight="650">模式改变职责深度，不改变已经确认的事实</text>
