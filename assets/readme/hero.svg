<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">MyP-M-A v0.43 Stable 面向团队协作与 Vibe Coding 的中文产品工作流</title>
  <desc id="desc">MyP-M-A 让团队协作型和 Vibe Coding 型交付共享同一份产品事实、范围、状态、指标和验收合同。</desc>

  <rect width="1200" height="460" rx="20" fill="#0B1412"/>
  <rect x="1" y="1" width="1198" height="458" rx="19" fill="none" stroke="#2A3B36" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="58" fill="#F0B35B" font-size="17" font-weight="700">TEAM WORK · VIBE CODING · 中文优先</text>
    <text x="56" y="142" fill="#F6F2E8" font-size="68" font-weight="750">MyP-M-A</text>
    <text x="56" y="190" fill="#D4DED9" font-size="27" font-weight="650">从需求判断，到完整 PRD 与交付验收</text>
    <text x="56" y="232" fill="#9FB2AA" font-size="20">为团队写清需求，也为 Agent 留下明确的下一步</text>
    <text x="56" y="264" fill="#9FB2AA" font-size="20">正确性、证据与完整性优先</text>

    <g transform="translate(56 302)">
      <rect width="206" height="44" rx="6" fill="#352A18" stroke="#F0B35B"/>
      <circle cx="22" cy="22" r="5" fill="#F0B35B"/>
      <text x="38" y="29" fill="#F6F2E8" font-size="18" font-weight="700">v0.43 Stable</text>
    </g>

    <g transform="translate(56 370)">
      <rect width="150" height="52" rx="6" fill="#111F1B" stroke="#2A3B36"/>
      <text x="16" y="33" fill="#D4DED9" font-size="21" font-weight="650">完整需求</text>
    </g>
    <g transform="translate(218 370)">
      <rect width="150" height="52" rx="6" fill="#111F1B" stroke="#2A3B36"/>
      <text x="16" y="33" fill="#D4DED9" font-size="21" font-weight="650">职责清晰</text>
    </g>
    <g transform="translate(380 370)">
      <rect width="150" height="52" rx="6" fill="#111F1B" stroke="#2A3B36"/>
      <text x="16" y="33" fill="#D4DED9" font-size="21" font-weight="650">证据验收</text>
    </g>

    <line x1="620" y1="38" x2="620" y2="422" stroke="#2A3B36" stroke-width="2"/>

    <g transform="translate(662 46)">
      <text x="0" y="18" fill="#A8BBB3" font-size="20" font-weight="700">同一份产品事实，两种交付深度</text>

      <g transform="translate(0 46)">
        <rect width="480" height="98" rx="8" fill="#132721" stroke="#39BC91" stroke-width="2"/>
        <text x="20" y="30" fill="#75D4B4" font-size="14" font-weight="700">SHARED PRODUCT CONTRACT</text>
        <text x="20" y="60" fill="#F6F2E8" font-size="22" font-weight="750">共享产品合同</text>
        <text x="20" y="84" fill="#A8BBB3" font-size="19">事实 · 范围 · 状态 · 指标 · 验收</text>
      </g>

      <path d="M240 144 V170 M112 170 H368 M112 170 V186 M368 170 V186" fill="none" stroke="#526A61" stroke-width="2"/>

      <g transform="translate(0 186)">
        <rect width="226" height="130" rx="8" fill="#111F1B" stroke="#39BC91"/>
        <rect x="16" y="16" width="74" height="28" rx="4" fill="#17382F"/>
        <text x="53" y="36" text-anchor="middle" fill="#75D4B4" font-size="14" font-weight="700">team_pm</text>
        <text x="16" y="72" fill="#F6F2E8" font-size="20" font-weight="750">团队协作型</text>
        <text x="16" y="99" fill="#A8BBB3" font-size="18">产品定义 → 团队承接</text>
        <text x="16" y="121" fill="#A8BBB3" font-size="16">默认 · 不猜物理实现</text>
